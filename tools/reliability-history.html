<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>设备可靠性历史记录 - xzy的网站</title>
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="stylesheet" href="/style.css?v=20260805">
    <meta name="description" content="仿Windows可靠性历史记录功能，展示鼠标设备稳定性指数变化，支持记录丢帧、滚轮回滚、按键双击等问题。">
    <meta property="og:title" content="设备可靠性历史记录 - xzy的网站">
    <meta property="og:description" content="仿Windows可靠性监视器，展示鼠标设备的稳定性变化与关键事件">
    <meta property="og:type" content="website">
</head>
<body>
    <noscript><div class="card" style="text-align:center;padding:40px;margin:20px"><p>请启用 JavaScript 以浏览本站。</p></div></noscript>
    <div id="site-nav"></div>
    <div id="site-header"></div>

    <div class="reliability-container">
        <div class="stats-row">
            <div class="stat-tile" id="tileIndex">
                <div class="stat-value" id="currentIndex">--</div>
                <div class="stat-label">当前稳定性指数</div>
            </div>
            <div class="stat-tile">
                <div class="stat-value" id="totalEvents">0</div>
                <div class="stat-label">累计事件数</div>
            </div>
            <div class="stat-tile">
                <div class="stat-value" id="criticalCount">0</div>
                <div class="stat-label">严重事件</div>
            </div>
            <div class="stat-tile">
                <div class="stat-value" id="daysSinceIssue">--</div>
                <div class="stat-label">距上次问题</div>
            </div>
        </div>

        <div class="report-area">
            <button class="btn-report" id="btnOpenModal"><svg viewBox="0 0 24 24" width="18" height="18"><polygon points="12,2 2,21 22,21" fill="#F9A825" stroke="#E65100" stroke-width="1.5" stroke-linejoin="round"/><line x1="12" y1="9" x2="12" y2="14" stroke="#333" stroke-width="2.5" stroke-linecap="round"/><circle cx="12" cy="17.5" r="1.2" fill="#333"/></svg> 记录鼠标问题</button>
        </div>

        <div class="monitor-card">
            <h2><span class="icon"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="2" y="13" width="5" height="9" rx="1" fill="currentColor" opacity=".45"/><rect x="9.5" y="7" width="5" height="15" rx="1" fill="currentColor" opacity=".7"/><rect x="17" y="3" width="5" height="19" rx="1" fill="currentColor"/></svg></span> 稳定性指数趋势</h2>
            <p class="subtitle">范围 1-10，正常使用时随时间对数恢复；发生问题则立即下降</p>
            <div class="chart-wrapper" id="chartWrapper">
                <canvas id="stabilityChart"></canvas>
                <div class="chart-tooltip" id="chartTooltip"></div>
            </div>
            <div class="chart-legend">
                <span><span class="legend-dot info"></span> 轻微影响</span>
                <span><span class="legend-dot warning"></span> 中等影响</span>
                <span><span class="legend-dot critical"></span> 严重影响</span>
            </div>
        </div>

        <div class="monitor-card">
            <h2><span class="icon"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="5" y="2" width="14" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="8.5" y="1" width="7" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><line x1="8" y1="9" x2="16" y2="9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="8" y1="13" x2="16" y2="13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="8" y1="17" x2="12" y2="17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span> 详细事件记录</h2>
            <p class="subtitle">所有问题记录与系统事件，按日期分组（可点击 <svg viewBox="0 0 24 24" width="14" height="14"><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg> 删除误报）</p>
            <div class="event-list" id="eventList"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3>记录鼠标问题</h3>
            <p class="modal-sub">选择遇到的问题类型，系统将自动降低可靠性指数</p>
            <label>问题类型</label>
            <div class="issue-grid" id="issueGrid"></div>
            <label>补充说明（可选）</label>
            <textarea id="issueNote" placeholder="例如：在游戏中突然丢帧约2秒..."></textarea>
            <div class="modal-buttons">
                <button class="btn btn-cancel" id="btnCancel">取消</button>
                <button class="btn btn-primary" id="btnSubmit" disabled>记录问题</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <div id="site-footer"></div>

    <script>
(function() {
    "use strict";

    var RECOVERY_RATE = 0.5;
    var MAX_INDEX = 10.0;
    var MIN_INDEX = 1.0;
    var INITIAL_INDEX = 7.0;
    var CHART_DAYS = 14;
    var LIVE_UPDATE_MS = 30000;
    var STORAGE_KEY = "reliability_data";

    var ISSUE_TYPES = [
        { id: "frame_drop",      label: "鼠标丢帧",       impact: -1.5, severity: "warning",  desc: "指针移动不流畅、跳帧或卡顿" },
        { id: "scroll_rollback", label: "滚轮回滚",       impact: -1.5, severity: "warning",  desc: "滚动时页面反向回弹" },
        { id: "double_click",    label: "按键双击",       impact: -2.0, severity: "critical", desc: "单击触发两次点击" },
        { id: "disconnect",      label: "连接断开",       impact: -3.0, severity: "critical", desc: "鼠标与接收器失去连接" },
        { id: "driver_crash",    label: "驱动崩溃",       impact: -3.5, severity: "critical", desc: "驱动程序无响应或报错" },
        { id: "pointer_lag",     label: "指针延迟",       impact: -1.8, severity: "warning",  desc: "移动鼠标后指针明显滞后" },
        { id: "side_button",     label: "侧键失灵",       impact: -1.3, severity: "warning",  desc: "侧键按下无反应或误触发" },
        { id: "low_battery",     label: "电池不足",       impact: -0.8, severity: "info",     desc: "电量低于15%，影响性能" },
        { id: "interference",    label: "信号干扰",       impact: -1.2, severity: "warning",  desc: "2.4GHz频段干扰导致不稳定" },
        { id: "sensor_dirty",    label: "传感器脏污",     impact: -1.0, severity: "info",     desc: "移动轨迹异常或抖动" }
    ];

    var issueTypeMap = {};
    ISSUE_TYPES.forEach(function(t) { issueTypeMap[t.id] = t; });

    // Resolve icon SVG at call time (components.js may not have loaded at parse time)
    function getSeverityIcon(severity) {
        var icons = window.__siteIcons || {};
        if (severity === "critical") return icons.xmark || "✕";
        if (severity === "warning") return icons.exclaim || "!";
        return icons.info || "i";
    }

    function getStatusIcon(score) {
        var icons = window.__siteIcons || {};
        if (score >= 8) return icons.check || "✅";
        if (score >= 6) return icons.warning || "⚠️";
        return icons.cross || "❌";
    }

    function getStatusLabel(score) {
        if (score >= 8) return "稳定";
        if (score >= 6) return "一般";
        return "不稳定";
    }

    function loadData() {
        try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (raw) { var data = JSON.parse(raw); if (data.events && Array.isArray(data.events)) return data; }
        } catch (e) {}
        return null;
    }

    function saveData(data) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
        catch (e) { showToast("存储空间不足，请清理旧数据"); }
    }

    function seedData() {
        var now = Date.now();
        var HOUR = 3600000;
        var events = [];
        var evId = 0;
        function add(hoursAgo, typeId, note) {
            var t = issueTypeMap[typeId];
            evId++;
            events.push({ id: "seed_" + evId, timestamp: now - Math.round(hoursAgo * HOUR), typeId: typeId, title: t.label, impact: t.impact, severity: t.severity, note: note || t.desc, isSeed: true });
        }
        add(335, "frame_drop",      "游戏时出现短暂丢帧");
        add(320, "interference",    "附近路由器干扰");
        add(290, "pointer_lag",     "系统高负载时出现延迟");
        add(260, "low_battery",     "电量降至12%");
        add(215, "driver_crash",    "G HUB 驱动崩溃，重启后恢复");
        add(195, "scroll_rollback", "浏览网页时滚轮回弹");
        add(165, "double_click",    "左键偶尔双击，影响拖拽操作");
        add(140, "side_button",     "前进侧键无响应");
        add(110, "sensor_dirty",    "鼠标垫积灰导致追踪不准");
        add(75,  "pointer_lag",     "蓝牙模式下延迟增大");
        add(48,  "frame_drop",      "无线模式下偶尔丢帧");
        return { events: events, lastUpdate: now };
    }

    function recoverIndex(currentIndex, hoursElapsed) {
        if (hoursElapsed <= 0) return currentIndex;
        var gap = MAX_INDEX - currentIndex;
        if (gap <= 0.001) return MAX_INDEX;
        var newGap = gap * Math.exp(-RECOVERY_RATE * hoursElapsed / MAX_INDEX);
        return MAX_INDEX - newGap;
    }

    function calculateCurrentIndex(events, fromTime, toTime) {
        var idx = INITIAL_INDEX;
        var prevTs = fromTime;
        var sorted = (events || []).slice().sort(function(a, b) { return a.timestamp - b.timestamp; });
        for (var i = 0; i < sorted.length; i++) {
            var ev = sorted[i];
            if (ev.timestamp > toTime) break;
            var hrs = Math.max(0, (ev.timestamp - prevTs) / 3600000);
            idx = recoverIndex(idx, hrs);
            idx = Math.max(MIN_INDEX, Math.min(MAX_INDEX, idx + ev.impact));
            prevTs = ev.timestamp;
        }
        if (toTime > prevTs) {
            var hrsRemaining = Math.max(0, (toTime - prevTs) / 3600000);
            idx = recoverIndex(idx, hrsRemaining);
        }
        return Math.max(MIN_INDEX, Math.min(MAX_INDEX, idx));
    }

    function getDailyIndexHistory(events, trackingStart, now) {
        var DAY = 86400000;
        var result = [];
        var startDate = new Date(now);
        startDate.setHours(0, 0, 0, 0);
        startDate = new Date(startDate.getTime() - (CHART_DAYS - 1) * DAY);
        for (var d = 0; d < CHART_DAYS; d++) {
            var dayStart = new Date(startDate.getTime() + d * DAY);
            var dayEnd   = new Date(dayStart.getTime() + DAY);
            var dayTs = Math.min(dayEnd.getTime(), now);
            var idx = calculateCurrentIndex(events, trackingStart, dayTs);
            var dayEvents = (events || []).filter(function(ev) {
                return ev.timestamp >= dayStart.getTime() && ev.timestamp < dayEnd.getTime();
            });
            var hasCritical = dayEvents.some(function(ev) { return ev.severity === "critical"; });
            var hasWarning  = dayEvents.some(function(ev) { return ev.severity === "warning"; });
            var hasInfo     = dayEvents.some(function(ev) { return ev.severity === "info"; });
            var dateLabel = String(dayStart.getMonth() + 1).padStart(2, "0") + "-" + String(dayStart.getDate()).padStart(2, "0");
            result.push({ date: dateLabel, score: idx, dayIndex: d, eventCount: dayEvents.length, hasCritical: hasCritical, hasWarning: hasWarning, hasInfo: hasInfo, dayTs: dayTs });
        }
        return result;
    }

    var canvas, ctx, tooltip, wrapper;
    var stabilityData = [];

    function getFromTime(events, now) {
        var earliestEv = events && events.length > 0 ? events.reduce(function(min, ev) { return Math.min(min, ev.timestamp); }, now) : now;
        return Math.min(earliestEv, now - CHART_DAYS * 86400000);
    }

    function getCSSVar(name, fallback) {
        var v = getComputedStyle(document.body).getPropertyValue(name);
        return (v && v.trim()) ? v.trim() : fallback;
    }

    function resizeCanvas() {
        var rect = wrapper.getBoundingClientRect();
        var w = rect.width;
        var h = rect.height || 300;
        var dpr = window.devicePixelRatio || 1;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
        drawChart(w, h);
    }

    function drawChart(w, h) {
        var pad = { top: 30, right: 30, bottom: 45, left: 45 };
        var plotW = w - pad.left - pad.right;
        var plotH = h - pad.top - pad.bottom;
        var n = stabilityData.length;
        if (n === 0) return;
        ctx.clearRect(0, 0, w, h);
        var borderColor = getCSSVar("--border", "#D8D8D8");
        var mutedColor  = getCSSVar("--muted", "#555");
        var accentColor = getCSSVar("--accent", "#0078D4");
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 0.5;
        ctx.fillStyle = mutedColor;
        ctx.font = "11px Arial, sans-serif";
        ctx.textAlign = "right";
        for (var yVal = 1; yVal <= 10; yVal++) {
            var y = pad.top + plotH - (yVal / 10) * plotH;
            ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
            ctx.fillText(yVal, pad.left - 8, y + 4);
        }
        ctx.strokeStyle = "rgba(249,168,37,0.4)";
        ctx.lineWidth = 1;
        ctx.setLineDash([6, 4]);
        var y7 = pad.top + plotH - (7 / 10) * plotH;
        ctx.beginPath(); ctx.moveTo(pad.left, y7); ctx.lineTo(w - pad.right, y7); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = mutedColor;
        ctx.textAlign = "center";
        var labelStep = n <= 7 ? 1 : n <= 14 ? 2 : 3;
        for (var i = 0; i < n; i += labelStep) {
            var x = pad.left + (i / (n - 1)) * plotW;
            ctx.fillText(stabilityData[i].date, x, pad.top + plotH + 18);
        }
        if ((n - 1) % labelStep !== 0) {
            ctx.fillText(stabilityData[n - 1].date, pad.left + plotW, pad.top + plotH + 18);
        }
        ctx.beginPath();
        var firstX = pad.left;
        var firstY = pad.top + plotH - (stabilityData[0].score / 10) * plotH;
        ctx.moveTo(firstX, pad.top + plotH);
        ctx.lineTo(firstX, firstY);
        for (var j = 1; j < n; j++) {
            var xi = pad.left + (j / (n - 1)) * plotW;
            var yi = pad.top + plotH - (stabilityData[j].score / 10) * plotH;
            ctx.lineTo(xi, yi);
        }
        ctx.lineTo(pad.left + plotW, pad.top + plotH);
        ctx.closePath();
        var shadeGrad = ctx.createLinearGradient(0, pad.top, 0, pad.top + plotH);
        shadeGrad.addColorStop(0, accentColor + "30");
        shadeGrad.addColorStop(1, accentColor + "05");
        ctx.fillStyle = shadeGrad;
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(firstX, firstY);
        for (var k = 1; k < n; k++) {
            var xk = pad.left + (k / (n - 1)) * plotW;
            var yk = pad.top + plotH - (stabilityData[k].score / 10) * plotH;
            ctx.lineTo(xk, yk);
        }
        ctx.strokeStyle = accentColor;
        ctx.lineWidth = 2.5;
        ctx.lineJoin = "round";
        ctx.stroke();
        for (var m = 0; m < n; m++) {
            var px = pad.left + (m / (n - 1)) * plotW;
            var py = pad.top + plotH - (stabilityData[m].score / 10) * plotH;
            var sd = stabilityData[m];
            if (sd.hasCritical) {
                ctx.beginPath(); ctx.arc(px, py, 9, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(231,72,86,0.2)"; ctx.fill();
                ctx.strokeStyle = "#E74856"; ctx.lineWidth = 2; ctx.stroke();
            } else if (sd.hasWarning) {
                ctx.beginPath(); ctx.arc(px, py, 8, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(249,168,37,0.2)"; ctx.fill();
                ctx.strokeStyle = "#F9A825"; ctx.lineWidth = 2; ctx.stroke();
            }
            ctx.beginPath(); ctx.arc(px, py, 4.5, 0, Math.PI * 2);
            ctx.fillStyle = accentColor; ctx.fill();
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
        }
    }

    function setupTooltip() {
        canvas.addEventListener("mousemove", function(e) {
            var rect = canvas.getBoundingClientRect();
            var w = rect.width, h = rect.height;
            var pad = { top: 30, right: 30, bottom: 45, left: 45 };
            var plotW = w - pad.left - pad.right, plotH = h - pad.top - pad.bottom;
            var n = stabilityData.length;
            if (n === 0) return;
            var mx = e.clientX - rect.left, my = e.clientY - rect.top;
            var closest = -1, minDist = Infinity;
            for (var i = 0; i < n; i++) {
                var px = pad.left + (i / (n - 1)) * plotW;
                var py = pad.top + plotH - (stabilityData[i].score / 10) * plotH;
                var dist = Math.sqrt((mx - px) * (mx - px) + (my - py) * (my - py));
                if (dist < minDist) { minDist = dist; closest = i; }
            }
            if (minDist < 30 && closest >= 0) {
                var d = stabilityData[closest];
                var px = pad.left + (closest / (n - 1)) * plotW;
                var statusText = getStatusIcon(d.score) + " " + getStatusLabel(d.score);
                var eventLine = d.eventCount > 0 ? '<div class="tt-events">' + d.eventCount + ' 个事件</div>' : '<div class="tt-events">无特殊事件</div>';
                tooltip.innerHTML = '<div class="tt-date">' + d.date + " " + statusText + '</div>' + '<div class="tt-score">指数：<b>' + d.score.toFixed(1) + '</b> / 10</div>' + eventLine;
                var ttW = tooltip.offsetWidth;
                var left = px - ttW / 2;
                if (left < 0) left = 4;
                if (left + ttW > w) left = w - ttW - 4;
                tooltip.style.left = left + "px";
                tooltip.style.top = "4px";
                tooltip.style.display = "block";
            } else {
                tooltip.style.display = "none";
            }
        });
        canvas.addEventListener("mouseleave", function() { tooltip.style.display = "none"; });
    }

    function buildEventList(events) {
        var container = document.getElementById("eventList");
        if (!events || events.length === 0) {
            var mouseIcon = (window.__siteIcons && window.__siteIcons.mouse) || '🖱️';
            container.innerHTML = '<div class="empty-state"><div class="empty-icon">' + mouseIcon + '</div><p>暂无事件记录。点击上方按钮记录第一个问题。</p></div>';
            return;
        }
        var sorted = events.slice().sort(function(a, b) { return b.timestamp - a.timestamp; });
        var groups = {};
        sorted.forEach(function(ev) {
            var d = new Date(ev.timestamp);
            var key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
            if (!groups[key]) groups[key] = [];
            groups[key].push(ev);
        });
        var html = "";
        Object.keys(groups).forEach(function(dateStr) {
            var parts = dateStr.split("-");
            var label = parts[0] + "年" + parseInt(parts[1]) + "月" + parseInt(parts[2]) + "日";
            html += '<div class="event-day-group"><div class="event-day-label">' + label + '</div>';
            groups[dateStr].forEach(function(ev) {
                var iconClass = ev.severity;
                var iconSymbol = getSeverityIcon(ev.severity);
                var timeStr = String(new Date(ev.timestamp).getHours()).padStart(2, "0") + ":" + String(new Date(ev.timestamp).getMinutes()).padStart(2, "0");
                html += '<div class="event-item" data-id="' + ev.id + '">';
                html += '<div class="event-icon ' + iconClass + '">' + iconSymbol + '</div>';
                html += '<div class="event-details">';
                html += '<div class="event-title">' + ev.title + ' <span style="color:var(--muted);font-weight:normal;font-size:0.78rem">(' + (ev.impact >= 0 ? "+" : "") + ev.impact.toFixed(1) + ')</span></div>';
                html += '<div class="event-desc">' + (ev.note || "") + '</div>';
                html += '</div>';
                html += '<div class="event-time">' + timeStr + '</div>';
                html += '<button class="event-delete" data-id="' + ev.id + '" title="删除此记录">' + (window.__siteIcons && window.__siteIcons.xmark || "✕") + '</button>';
                html += '</div>';
            });
            html += '</div>';
        });
        container.innerHTML = html;
        container.querySelectorAll(".event-delete").forEach(function(btn) {
            btn.addEventListener("click", function(e) {
                e.stopPropagation();
                deleteEvent(this.getAttribute("data-id"));
            });
        });
    }

    function deleteEvent(evId) {
        var data = loadData();
        if (!data) return;
        var ev = data.events.find(function(e) { return e.id === evId; });
        var label = ev ? ev.title : "此事件";
        if (!confirm("确定要删除 「" + label + "」 吗？\n删除后指数将重新计算且无法恢复。")) return;
        data.events = data.events.filter(function(ev) { return ev.id !== evId; });
        saveData(data);
        refreshAll();
        showToast("已删除「" + label + "」，指数已重新计算");
    }

    function updateStats(events, currentIndex) {
        var idxEl = document.getElementById("currentIndex");
        var tileEl = document.getElementById("tileIndex");
        idxEl.textContent = currentIndex.toFixed(1);
        tileEl.classList.remove("good", "warn", "bad");
        if (currentIndex >= 8) tileEl.classList.add("good");
        else if (currentIndex >= 6) tileEl.classList.add("warn");
        else tileEl.classList.add("bad");
        var total = events ? events.length : 0;
        var critical = events ? events.filter(function(ev) { return ev.severity === "critical"; }).length : 0;
        document.getElementById("totalEvents").textContent = total;
        document.getElementById("criticalCount").textContent = critical;
        var daysEl = document.getElementById("daysSinceIssue");
        if (!events || events.length === 0) {
            daysEl.textContent = "--";
        } else {
            var lastTs = events.reduce(function(max, ev) { return Math.max(max, ev.timestamp); }, 0);
            var days = Math.floor((Date.now() - lastTs) / 86400000);
            if (days === 0) {
                var hrs = Math.floor((Date.now() - lastTs) / 3600000);
                daysEl.textContent = hrs <= 1 ? "<1 小时" : hrs + " 小时";
            } else {
                daysEl.textContent = days + " 天";
            }
        }
    }

    var selectedIssueType = null;

    function setupModal() {
        var grid = document.getElementById("issueGrid");
        var html = "";
        ISSUE_TYPES.forEach(function(t) {
            html += '<div class="issue-option" data-type="' + t.id + '">';
            html += '<div class="io-icon ' + t.severity + '">' + getSeverityIcon(t.severity) + '</div>';
            html += '<div>' + t.label + '</div>';
            html += '<div class="io-impact">' + (t.impact >= 0 ? "+" : "") + t.impact.toFixed(1) + '</div>';
            html += '</div>';
        });
        grid.innerHTML = html;
        grid.querySelectorAll(".issue-option").forEach(function(opt) {
            opt.addEventListener("click", function() {
                grid.querySelectorAll(".issue-option").forEach(function(o) { o.classList.remove("selected"); });
                this.classList.add("selected");
                selectedIssueType = this.getAttribute("data-type");
                document.getElementById("btnSubmit").disabled = false;
            });
        });
        document.getElementById("btnOpenModal").addEventListener("click", function() {
            document.getElementById("modalOverlay").classList.add("active");
            selectedIssueType = null;
            grid.querySelectorAll(".issue-option").forEach(function(o) { o.classList.remove("selected"); });
            document.getElementById("issueNote").value = "";
            document.getElementById("btnSubmit").disabled = true;
        });
        document.getElementById("btnCancel").addEventListener("click", function() {
            document.getElementById("modalOverlay").classList.remove("active");
        });
        document.getElementById("modalOverlay").addEventListener("click", function(e) {
            if (e.target === this) this.classList.remove("active");
        });
        document.getElementById("btnSubmit").addEventListener("click", function() {
            if (!selectedIssueType) return;
            var note = document.getElementById("issueNote").value.trim();
            reportIssue(selectedIssueType, note);
            document.getElementById("modalOverlay").classList.remove("active");
        });
        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape") document.getElementById("modalOverlay").classList.remove("active");
        });
    }

    function reportIssue(typeId, note) {
        var t = issueTypeMap[typeId];
        if (!t) return;
        var data = loadData();
        if (!data) { data = seedData(); }
        var now = Date.now();
        var ev = { id: "ev_" + now + "_" + Math.random().toString(36).slice(2, 7), timestamp: now, typeId: typeId, title: t.label, impact: t.impact, severity: t.severity, note: note || t.desc, isSeed: false };
        data.events.push(ev);
        saveData(data);
        refreshAll();
        showToast("已记录：「" + t.label + "」 指数 " + (t.impact >= 0 ? "+" : "") + t.impact.toFixed(1));
    }

    var toastTimer;
    function showToast(msg) {
        var el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function() { el.classList.remove("show"); }, 2500);
    }

    function refreshAll() {
        var data = loadData();
        var now = Date.now();
        if (!data) { data = seedData(); saveData(data); }
        var fromTime = getFromTime(data.events, now);
        var currentIdx = calculateCurrentIndex(data.events, fromTime, now);
        stabilityData = getDailyIndexHistory(data.events, fromTime, now);
        data.lastUpdate = now;
        saveData(data);
        updateStats(data.events, currentIdx);
        resizeCanvas();
        buildEventList(data.events);
    }

    window.addEventListener("load", function() {
        canvas = document.getElementById("stabilityChart");
        ctx = canvas.getContext("2d");
        tooltip = document.getElementById("chartTooltip");
        wrapper = document.getElementById("chartWrapper");
        setupTooltip();
        setupModal();
        refreshAll();
        setInterval(function() {
            var data = loadData();
            if (!data) return;
            var now = Date.now();
            var fromTime = getFromTime(data.events, now);
            var currentIdx = calculateCurrentIndex(data.events, fromTime, now);
            updateStats(data.events, currentIdx);
            stabilityData = getDailyIndexHistory(data.events, fromTime, now);
            resizeCanvas();
        }, LIVE_UPDATE_MS);
    });

    window.addEventListener("resize", function() {
        if (stabilityData.length > 0) resizeCanvas();
    });

    // Redraw on theme toggle — listen after components.js creates the button
    document.addEventListener("click", function(e) {
        if (e.target && e.target.classList.contains("theme-toggle")) {
            setTimeout(function() { if (stabilityData.length > 0) resizeCanvas(); }, 300);
        }
    });
})();
    </script>

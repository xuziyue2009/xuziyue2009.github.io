<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>分解质因数 - xzy的网站</title>
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="stylesheet" href="/style.css">
    <meta name="description" content="分解质因数工具，将输入的合数分解为质因数。">
    <meta property="og:title" content="分解质因数 - xzy的网站">
    <meta property="og:description" content="分解质因数工具">
    <meta property="og:type" content="website">
</head>
<body>
    <div id="site-nav"></div>
    <div id="site-header"></div>

    <div class="row">
        <div class="fullcolumn">
            <div class="card">
                <h2>输入一个合数</h2>
                <input type="number" min="1" max="2147483647" name="inputx" id="inputx">
                <input type="button" id="button" value="分解">
                <div id="result">结果：</div>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>
    <script src="/tools/script.js"></script>
    <script>
        var x = document.getElementById("inputx");
        var btn = document.getElementById("button")
        btn.onclick = function(){
            var num = x.value - 0;
            var result = factorize(num);
            var output = result[0];
            for (var i = 1; i < result.length; i++){
                output = output + " × " + result[i];
            }
            if (num == 2236){
                alert(":)");
            }
            output = "结果：" + num + " = " + output;
            document.getElementById("result").innerHTML = output;
        }
    </script>
    <script src="/components.js"></script>
    <script src="/script.js"></script>
</body>
</html>

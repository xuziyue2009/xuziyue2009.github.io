    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>分解质因数 - xzy的网站</title>
        <link rel="shortcut icon" href="/favicon.ico">
        <link rel="stylesheet" type="text/css" href="/style.css">
        <meta name="description" content="分解质因数工具，将输入的合数分解为质因数。">
        <meta http-equiv="content-language" content="zh-cn">
    </head>
    <body>
        <div class="topnav">
            <a href="/">首页</a>
            <a href="/tools/index.html">工具</a>
            <a href="/games/index.html">游戏</a>
            <a href="/blogs/index.html">博客</a>
            <a href="/files/index.html">文件</a>

        <div class="header">
            <img src="/media/logo.png" alt="logo" width="40px" height="40px" loading="lazy">
            <h1>分解质因数</h1>
            <input type="text" id="search" placeholder="搜索本站内容...">
            <button id="theme-toggle">切换主题</button>
            <div id="date">now_date</div>
            <div id="time">now_time</div>
            <p>把合数写成几个质数相乘的形式</p>
        </div>
        <div class="tool-content">
            <hr>
            <h2>输入一个合数</h2>
            <input type="number" min="1" max="2147483647" name="inputx" id="inputx">
            <input type="button" id="button" value="分解">
            <div id="result">结果：</div>

            <script type="text/javascript">
                var x = document.getElementById("inputx");
                btn = document.getElementById("button")
                btn.onclick = function(){
                    var num = x.value - 0;
			        var result = factorize(num);
                    var output = result[0];

                    for (var i = 1; i < result.length; i++){
                        output = output + " × " + result[i];
                    }

                    if (num == 2236){
                        alert(":)");
                    }
                    output = "结果：" + num + " = " + output;
                    document.getElementById("result").innerHTML = output;
                }
            </script>
        </div>

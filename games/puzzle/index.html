<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>数字华容道 - xzy的网站</title>
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="stylesheet" href="/style.css?v=20260805">
    <meta name="description" content="拼图游戏页面，体验数字华容道。">
    <meta property="og:title" content="数字华容道 - xzy的网站">
    <meta property="og:description" content="经典数字拼图，滑动方块按顺序排列">
    <meta property="og:type" content="website">
</head>
<body>
    <noscript><div class="card" style="text-align:center;padding:40px;margin:20px"><p>请启用 JavaScript 以浏览本站。</p></div></noscript>
    <div id="site-nav"></div>
    <div id="site-header"></div>

    <div class="row">
        <div class="fullcolumn">
            <div class="card">
                <div class="puzzle-container">
                    <p>点击数字方块移动到空位，按顺序排列 1-15 即可获胜。</p>
                    <p>步数：<span id="move-count">0</span></p>
                    <div class="puzzle-message" id="puzzle-msg"></div>
                    <div class="puzzle-board" id="puzzle-board"></div>
                    <div class="puzzle-controls">
                        <button id="puzzle-shuffle">洗牌</button>
                        <button id="puzzle-reset">重置</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>
    <script src="/components.js?v=20260805"></script>
    <script src="script.js"></script>
    <script src="/script.js?v=20260805"></script>
</body>
</html>
